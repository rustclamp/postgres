services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: rustclamp_test
      POSTGRES_USER: rustclamp_test
      POSTGRES_PASSWORD: rustclamp_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rustclamp_test -d rustclamp_test"]
      interval: 1s
      timeout: 3s
      retries: 30
